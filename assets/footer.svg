<svg fill="none" width="850" height="120" viewBox="0 0 850 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ft-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e55" />
      <stop offset="50%" stop-color="#990000" />
      <stop offset="100%" stop-color="#ff2e55" />
    </linearGradient>

    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180407" />
      <stop offset="100%" stop-color="#0d0204" />
    </linearGradient>

    <filter id="ft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff2e55" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .quote-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14px;
      font-style: italic;
      font-weight: 500;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .brand-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #ff2e55;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Container -->
  <rect width="850" height="120" rx="14" fill="url(#ft-bg)" stroke="url(#ft-border)" stroke-width="1.5" filter="url(#ft-glow)"/>

  <!-- Top Line -->
  <line x1="220" y1="28" x2="630" y2="28" stroke="url(#ft-border)" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="425" cy="28" r="3.5" fill="#ff2e55"/>

  <!-- Quote -->
  <text x="425" y="62" text-anchor="middle" class="quote-text">"Transforming data and ideas into functional, impactful software."</text>

  <!-- Footer Tag -->
  <text x="425" y="90" text-anchor="middle" class="brand-text">DESIGNED FOR JAILANI SHAJITH M • 2026</text>
</svg>
