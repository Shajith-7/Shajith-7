<svg fill="none" width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ft-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ebcd95" />
      <stop offset="50%" stop-color="#eed5a5" />
      <stop offset="100%" stop-color="#f1deb5" />
    </linearGradient>

    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181614" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>

    <filter id="ft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .quote-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14px;
      font-style: italic;
      font-weight: 500;
      fill: #f1deb5;
      letter-spacing: 1px;
    }
    .brand-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #ebcd95;
      text-transform: uppercase;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="120" rx="12" fill="url(#ft-bg)" filter="url(#ft-shadow)"/>
  
  <!-- Outer Border -->
  <rect x="2" y="2" width="796" height="116" rx="10" fill="none" stroke="url(#ft-gold)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Top Line -->
  <line x1="200" y1="28" x2="600" y2="28" stroke="url(#ft-gold)" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="400" cy="28" r="3" fill="#ebcd95"/>

  <!-- Quote -->
  <text x="400" y="62" text-anchor="middle" class="quote-text">"Transforming data and ideas into functional, impactful software."</text>

  <!-- Footer Tag -->
  <text x="400" y="90" text-anchor="middle" class="brand-text">DESIGNED FOR JAILANI SHAJITH M • 2026</text>
</svg>
