      <stop offset="0%" stop-color="#dc2626" stop-opacity="0" />
      <stop offset="20%" stop-color="#dc2626" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffd700" stop-opacity="1" />
      <stop offset="80%" stop-color="#dc2626" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
