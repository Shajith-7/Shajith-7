<svg fill="none" width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Border Gradient -->
    <linearGradient id="cyan-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="220" rx="18" fill="url(#bg-grad)" stroke="url(#cyan-gold)" stroke-width="2" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#fbbf24" stroke-width="1" opacity="0.06">
    <line x1="0" y1="44" x2="850" y2="44" />
    <line x1="0" y1="88" x2="850" y2="88" />
    <line x1="0" y1="132" x2="850" y2="132" />
    <line x1="0" y1="176" x2="850" y2="176" />
    <line x1="170" y1="0" x2="170" y2="220" />
    <line x1="340" y1="0" x2="340" y2="220" />
    <line x1="510" y1="0" x2="510" y2="220" />
    <line x1="680" y1="0" x2="680" y2="220" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 28 28 L 56 28 M 28 28 L 28 56" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="28" r="3" fill="#38bdf8"/>

  <path d="M 822 28 L 794 28 M 822 28 L 822 56" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="822" cy="28" r="3" fill="#38bdf8"/>

  <path d="M 28 192 L 56 192 M 28 192 L 28 164" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="192" r="3" fill="#38bdf8"/>

  <path d="M 822 192 L 794 192 M 822 192 L 822 164" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="822" cy="192" r="3" fill="#38bdf8"/>

  <!-- Top Pill Badge -->
  <g transform="translate(265, 24)">
    <rect x="0" y="0" width="320" height="26" rx="13" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <circle cx="20" cy="13" r="4" fill="#38bdf8" />
    <text x="170" y="17" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="3">✦ WEB • DATA • AI SOFTWARE ✦</text>
  </g>

  <!-- Main Title -->
  <text x="425" y="108" text-anchor="middle" fill="url(#gold-grad)" font-family="sans-serif" font-size="38" font-weight="900" letter-spacing="4">JAILANI SHAJITH M</text>

  <!-- Subtitle Roles -->
  <text x="425" y="148" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">WEB DEVELOPER &nbsp;•&nbsp; DATA SCIENTIST &nbsp;•&nbsp; VIBE CODER</text>

  <!-- Divider Line -->
  <g transform="translate(280, 164)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.8"/>
    <polygon points="145,-4 153,0 145,4 137,0" fill="#38bdf8"/>
    <line x1="170" y1="0" x2="290" y2="0" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Bottom Tagline -->
  <text x="425" y="194" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">BUILDING PRACTICAL SOFTWARE &amp; DATA-DRIVEN INSIGHTS</text>
</svg>
