<svg fill="none" width="850" height="230" viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="gold-metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="text-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', Roboto, sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#text-light);
    }
    .role-subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .tag-badge {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: #fbbf24;
      text-transform: uppercase;
    }
    .mono-tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #94a3b8;
    }
    .grid-mesh {
      opacity: 0.05;
    }
  </style>

  <!-- Base Container -->
  <rect width="850" height="230" rx="20" fill="url(#obsidian-bg)" stroke="url(#border-glow)" stroke-width="2" />

  <!-- Ambient Radial Lighting Glow -->
  <circle cx="425" cy="115" r="220" fill="#f59e0b" fill-opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="425" cy="115" r="140" fill="#38bdf8" fill-opacity="0.08" filter="url(#soft-glow)" />

  <!-- Background Decorative Grid -->
  <g class="grid-mesh" stroke="#fbbf24" stroke-width="1">
    <line x1="0" y1="46" x2="850" y2="46" />
    <line x1="0" y1="92" x2="850" y2="92" />
    <line x1="0" y1="138" x2="850" y2="138" />
    <line x1="0" y1="184" x2="850" y2="184" />
    <line x1="170" y1="0" x2="170" y2="230" />
    <line x1="340" y1="0" x2="340" y2="230" />
    <line x1="510" y1="0" x2="510" y2="230" />
    <line x1="680" y1="0" x2="680" y2="230" />
  </g>

  <!-- Modern Geometric Edge Accents -->
  <!-- Left Accent Lines -->
  <path d="M 30 30 L 60 30 M 30 30 L 30 60" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30" cy="30" r="3" fill="#38bdf8"/>

  <!-- Right Accent Lines -->
  <path d="M 820 30 L 790 30 M 820 30 L 820 60" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="820" cy="30" r="3" fill="#38bdf8"/>

  <!-- Bottom Left Accent Lines -->
  <path d="M 30 200 L 60 200 M 30 200 L 30 170" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30" cy="200" r="3" fill="#38bdf8"/>

  <!-- Bottom Right Accent Lines -->
  <path d="M 820 200 L 790 200 M 820 200 L 820 170" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="820" cy="200" r="3" fill="#38bdf8"/>

  <!-- Top Pill Tag -->
  <g transform="translate(265, 28)">
    <rect x="0" y="0" width="320" height="28" rx="14" fill="#1e293b" stroke="url(#gold-metallic)" stroke-width="1.5" />
    <circle cx="22" cy="14" r="4" fill="#38bdf8" />
    <text x="170" y="18" text-anchor="middle" class="tag-badge">✦ WEB • DATA • AI SOFTWARE ✦</text>
  </g>

  <!-- Main Title -->
  <text x="425" y="114" text-anchor="middle" class="name-title" filter="url(#soft-glow)">JAILANI SHAJITH M</text>

  <!-- Subtitle Roles -->
  <text x="425" y="156" text-anchor="middle" class="role-subtitle">WEB DEVELOPER &nbsp;•&nbsp; DATA SCIENTIST &nbsp;•&nbsp; VIBE CODER</text>

  <!-- Decorative Divider Bar -->
  <g transform="translate(280, 172)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="url(#gold-metallic)" stroke-width="1.5" stroke-opacity="0.8"/>
    <polygon points="145,-4 153,0 145,4 137,0" fill="#38bdf8"/>
    <line x1="170" y1="0" x2="290" y2="0" stroke="url(#gold-metallic)" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Bottom Monospace Quote -->
  <text x="425" y="204" text-anchor="middle" class="mono-tag">BUILDING PRACTICAL SOFTWARE &amp; DATA-DRIVEN INSIGHTS</text>
</svg>
