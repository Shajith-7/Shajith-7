<svg fill="none" width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180407" />
      <stop offset="50%" stop-color="#0d0204" />
      <stop offset="100%" stop-color="#1a0508" />
    </linearGradient>

    <!-- Neon Glow Filter for Title -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Red Border Gradient -->
    <linearGradient id="border-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e55" />
      <stop offset="50%" stop-color="#990000" />
      <stop offset="100%" stop-color="#ff2e55" />
    </linearGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e55" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .glow-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', Roboto, sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: #ff2e55;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      fill: #ff85a1;
      text-transform: uppercase;
    }
    .bottom-tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #e2e8f0;
    }
    .grid-lines {
      opacity: 0.08;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="220" rx="20" fill="url(#bg-glow)" stroke="url(#border-red)" stroke-width="2" />

  <!-- Ambient Center Red Halo Glow -->
  <circle cx="425" cy="110" r="180" fill="#ff1a40" fill-opacity="0.18" filter="url(#neon-glow)" />

  <!-- Cyberpunk Grid Overlay -->
  <g class="grid-lines" stroke="#ff2e55" stroke-width="1">
    <line x1="0" y1="44" x2="850" y2="44" />
    <line x1="0" y1="88" x2="850" y2="88" />
    <line x1="0" y1="132" x2="850" y2="132" />
    <line x1="0" y1="176" x2="850" y2="176" />
    <line x1="170" y1="0" x2="170" y2="220" />
    <line x1="340" y1="0" x2="340" y2="220" />
    <line x1="510" y1="0" x2="510" y2="220" />
    <line x1="680" y1="0" x2="680" y2="220" />
  </g>

  <!-- Corner Brackets (Exact Match to Image 1) -->
  <!-- Top Left Bracket -->
  <path d="M 24 45 L 24 24 L 45 24" stroke="#ff2e55" stroke-width="3.5" fill="none" stroke-linecap="square" />
  <!-- Top Right Bracket -->
  <path d="M 826 45 L 826 24 L 805 24" stroke="#ff2e55" stroke-width="3.5" fill="none" stroke-linecap="square" />
  <!-- Bottom Left Bracket -->
  <path d="M 24 175 L 24 196 L 45 196" stroke="#ff2e55" stroke-width="3.5" fill="none" stroke-linecap="square" />
  <!-- Bottom Right Bracket -->
  <path d="M 826 175 L 826 196 L 805 196" stroke="#ff2e55" stroke-width="3.5" fill="none" stroke-linecap="square" />

  <!-- Top Centered Pill Tag -->
  <g transform="translate(305, 26)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#300810" stroke="url(#pill-grad)" stroke-width="1.5" />
    <circle cx="20" cy="13" r="4" fill="#ff2e55" />
    <text x="130" y="17" text-anchor="middle" class="pill-text">BUILDING REAL-WORLD TECH</text>
  </g>

  <!-- Main Title (Glowing White & Neon Red Halo) -->
  <!-- Underglow Layer -->
  <text x="425" y="108" text-anchor="middle" class="glow-title" fill="#ff2e55" filter="url(#neon-glow)" opacity="0.9">JAILANI SHAJITH M</text>
  <!-- Sharp Foreground Layer -->
  <text x="425" y="108" text-anchor="middle" class="glow-title">JAILANI SHAJITH M</text>

  <!-- Subtitle Roles with Red Accent Diamond -->
  <text x="425" y="148" text-anchor="middle" class="subtitle-text">WEB DEVELOPER &nbsp;•&nbsp; DATA SCIENTIST &nbsp;•&nbsp; VIBE CODER</text>
  
  <!-- Central Diamond Accent -->
  <polygon points="425,158 429,163 425,168 421,163" fill="#ff2e55" />

  <!-- Bottom Tagline -->
  <text x="425" y="192" text-anchor="middle" class="bottom-tag">&lt;/&gt; BUILDING PRACTICAL AI &amp; WEB SOLUTIONS</text>
</svg>
